alertmanager:
  enabled: false

grafana:
  enabled: true
  adminPassword: "admin123"
  service:
    type: ClusterIP

prometheus:
  prometheusSpec:
    retention: 3d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
